# href = 客户端点击（tailnet 服务域名，无端口）
# siteMonitor / widget = 服务端请求（LAN IP，稳定）
- 管理面板:
    - Proxmox VE:
        icon: proxmox.png
        href: https://pve.example.ts.net
        description: 虚拟化平台 · 9.2.2
        siteMonitor: https://10.0.0.10:8006
        widget:
          type: proxmox
          url: https://10.0.0.10:8006
          username: ai@pve!agent
          password: ${PVE_TOKEN_SECRET}
          node: pve

    - Caddy:
